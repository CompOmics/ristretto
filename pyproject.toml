[project]
name = "ristretto-ms"
version = "0.1.0"
description = "Lean PSM rescoring for proteomics, purpose-built for ms2rescore"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ralf Gabriels", email = "ralf.gabriels@ugent.be" }]
dependencies = ["numpy>=2.0", "scikit-learn>=1.5", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pyarrow>=14.0", "pytest>=8.0"]
nb = ["ipykernel", "ipywidgets", "nbformat", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ristretto*"]

[tool.ruff]
line-length = 99
target-version = 'py311'

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
